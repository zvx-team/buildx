
name: Build Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL Website"
        required: true
        type: string

      app_name:
        description: "Nama Aplikasi"
        required: true
        type: string

      icon_url:
        description: "URL Icon Aplikasi"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/web2apk/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Web2APK"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.web2apk.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.web2apk.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/web2apk/app/MainActivity.java <<'EOF'
          package com.web2apk.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);

                  webView.loadUrl("${{ github.event.inputs.web_url }}");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download Application Icon
        run: |
          curl -fL "${{ github.event.inputs.icon_url }}" \
            -o icon.png
          file icon.png

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Check APK
        run: |
          find app/build/outputs/apk -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
